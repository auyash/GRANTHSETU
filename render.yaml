services:
  - type: web
    name: nfsu-library-kiosk
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KOHA_SERVER_IP
        value: 117.239.182.15
      - key: KOHA_SERVER_PORT
        value: 6001
      - key: KOHA_USER
        value: rfid
      - key: KOHA_PASS
        value: Rfid@123
