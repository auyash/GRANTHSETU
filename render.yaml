services:
  - type: web
    name: granthsetu-library-kiosk
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KOHA_MODE
        value: mock
      - key: KOHA_SERVER_IP
        sync: false
      - key: KOHA_SERVER_PORT
        sync: false
      - key: KOHA_USER
        sync: false
      - key: KOHA_PASS
        sync: false
      - key: KOHA_LOCATION
        sync: false
      - key: SIP2_ENCODING
        value: utf-8
      - key: SIP2_CHECK_SEQUENCE
        value: "false"
